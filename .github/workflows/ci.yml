# .github/workflows/ci.yml — host + CUDA CI
#
# Runs on every push and PR.  The host job compiles and tests the full
# C++ library with 100% line-coverage enforcement.  The CUDA job runs
# only on self-hosted runners tagged `cuda`.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Host build + test + coverage (no GPU required)
  # ------------------------------------------------------------------
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Configure (coverage)
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage -j$(nproc)

      - name: Test
        run: ctest --preset coverage --output-on-failure -j$(nproc)

      - name: Coverage gate (100 %)
        run: >
          python3 meta/scripts/coverage.py
          --build-dir build/coverage
          --source-dir src/c
          --min 100

      - name: Python smoke tests (fallback backend)
        run: |
          uv run vkl list
          uv run vkl info gemm
          uv run python -m pytest tests/python/ -v

  # ------------------------------------------------------------------
  # CUDA build + test (needs self-hosted runner with toolkit + GPU)
  # ------------------------------------------------------------------
  cuda:
    # Self-hosted on the ds6 runner (labels self-hosted,cuda). Runs inside
    # the runner-local `vkernels-ci:cuda13` image (CUDA 13.0 toolkit +
    # cmake + git + python3-dev + upgraded setuptools) with the host NVIDIA
    # driver injected by ~/runners/nvidia-docker.sh (--privileged +
    # SONAME-mapped lib mounts — no nvidia-container-runtime needed on the
    # runner). The `cuda` preset compiles for the native arch (GB10: sm_121).
    runs-on: [self-hosted, cuda]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CUDA release)
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 cmake --preset cuda

      - name: Build
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 cmake --build --preset cuda -j$(nproc)

      - name: Test
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 ctest --preset cuda --output-on-failure

      - name: Build wheel (CUDA)
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 bash -c "bash meta/scripts/build_wheel.sh --cuda --output-dir dist"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cuda
          path: dist/*.whl
          if-no-files-found: ignore
