# .github/workflows/ci.yml — host + CUDA CI
#
# Runs on every push and PR.  The host job compiles and tests the full
# C++ library with 100% line-coverage enforcement.  The CUDA job runs
# only on self-hosted runners tagged `cuda`.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Host build + test + coverage (no GPU required)
  # ------------------------------------------------------------------
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Lint (ruff, pyflakes)
        run: uvx ruff check src/python tests/python

      - name: Configure (coverage)
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage -j$(nproc)

      - name: Test
        run: ctest --preset coverage --output-on-failure -j$(nproc)

      - name: Coverage gate (100 %)
        run: >
          python3 meta/scripts/coverage.py
          --build-dir build/coverage
          --source-dir src/c
          --min 100

      - name: Python smoke tests (fallback backend)
        run: |
          uv run vkl list
          uv run vkl info gemm
          uv run python -m pytest tests/python/ -v

  # ------------------------------------------------------------------
  # CUDA build + test (needs self-hosted runner with toolkit + GPU)
  # ------------------------------------------------------------------
  cuda:
    # Self-hosted on the ds6 runner (labels self-hosted,cuda). Runs inside
    # the runner-local `vkernels-ci:cuda13` image (CUDA 13.0 toolkit +
    # cmake + git + python3-dev + upgraded setuptools) with the host NVIDIA
    # driver injected by ~/runners/nvidia-docker.sh (--privileged +
    # SONAME-mapped lib mounts — no nvidia-container-runtime needed on the
    # runner). The `cuda` preset compiles for the native arch (GB10: sm_121).
    runs-on: [self-hosted, cuda]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CUDA release)
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 cmake --preset cuda

      - name: Build
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 cmake --build --preset cuda -j$(nproc)

      - name: Test
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 ctest --preset cuda --output-on-failure

      # Issue #60: the kpool .hip device sources are compiled into libvkernels
      # by the CUDA build above, but the default target does not build the
      # device-vs-oracle harness (it lives under meta/benchmarks, OFF by
      # default). Reconfigure the SAME build dir with the benchmarks on (all
      # earlier objects are cache hits), build + run the kpool device
      # correctness test via its registered ctest entry, then exercise the
      # ctypes device-ABI python wrapper tests against the CUDA-built
      # libvkernels_c.so (stdlib unittest — no pytest/torch in the image; the
      # torch-dependent tests skip themselves).
      - name: kpool device correctness + device-ABI python tests
        run: |
          ~/runners/cuda-run.sh vkernels-ci:cuda13 bash -c '
            set -e
            cmake -S . -B build/cuda -DVKERNELS_BUILD_BENCHMARKS=ON
            cmake --build build/cuda --target test_dsa_kpool_correct -j"$(nproc)"
            ctest --test-dir build/cuda -R dsa_kpool_device_cuda --output-on-failure
            VKERNELS_LIB="$PWD/build/cuda/src/c/libvkernels_c.so" \
              python3 tests/python/test_dsa_kpool_device.py -v'

      - name: Device tests (self-contained megakernel templates, sm_121)
        # The six megakernel device-test files whose device tests are
        # self-contained (in-file oracles, no floe) run against the GB10
        # GPU. Tests need only python3 + numpy + pytest + torch + triton and
        # the pure-python package (conftest.py pins sys.path to src/python),
        # so no install step: pytest runs straight from the workspace.
        # pip bootstraps what the image lacks (per the kpool step above, the
        # image ships no pytest/torch) — idempotent (no-op once torch/triton
        # are baked in). Plain pip first; --break-system-packages covers
        # externally-managed pythons (PEP 668 rejects before downloading, so
        # the retry is cheap — and IS hit on the NGC base image).
        # Triton's loader, unlike torch's, needs a real file path for
        # libcuda.so.1: it only greps the ldconfig cache, which predates the
        # runner's SONAME-mapped driver mounts (dlopen-by-soname works — the
        # kpool step proves it — and once torch has loaded libcuda, triton's
        # dlopen returns the same handle, so any valid path satisfies
        # discovery). Locate the mount and export it.
        # gdn_delta's device test is excluded: it is floe-oracle-gated and
        # would only ever skip here.
        run: |
          ~/runners/cuda-run.sh vkernels-ci:cuda13 bash -c '
            set -e
            libcuda="$(find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o -name libcuda.so.1 -print 2>/dev/null | head -1)"
            if [ -z "$libcuda" ]; then
              echo "FATAL: libcuda.so.1 not visible in the container — check ~/runners/nvidia-docker.sh mounts"
              exit 1
            fi
            echo "triton: libcuda.so.1 at $libcuda"
            export LD_LIBRARY_PATH="$(dirname "$libcuda")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export TRITON_LIBCUDA_PATH="$(dirname "$libcuda")"
            python3 -m pip install --quiet numpy pytest torch triton || \
              python3 -m pip install --quiet --break-system-packages numpy pytest torch triton
            python3 -m pytest -v \
              tests/python/test_megakernel_rope_neox.py \
              tests/python/test_megakernel_gdn_conv.py \
              tests/python/test_megakernel_values_gate.py \
              tests/python/test_megakernel_kda_delta.py \
              tests/python/test_megakernel_indexer_topk.py \
              tests/python/test_megakernel_mla_decode.py
          '

      - name: Build wheel (CUDA)
        run: ~/runners/cuda-run.sh vkernels-ci:cuda13 bash -c "bash meta/scripts/build_wheel.sh --cuda --output-dir dist"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cuda
          path: dist/*.whl
          if-no-files-found: ignore
